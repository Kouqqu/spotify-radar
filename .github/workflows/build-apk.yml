name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK in Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup persistent debug keystore
        run: |
          mkdir -p ~/.android
          if [ -f "debug.keystore" ]; then
            cp debug.keystore ~/.android/debug.keystore
            echo "Persistent debug.keystore configured successfully"
          fi

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install dependencies & setup Capacitor
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyRadar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-${{ github.run_number }}
          name: "Spotify Radar v1.1.${{ github.run_number }}"
          body: |
            Обновление Spotify Radar для Android:
            - Отключено системное выделение текста и вибрация при удержании пальца (нативный вид приложения).
            - Фиксированная цифровая подпись для бесшовной установки обновлений.
            - Исправлен шеринг результатов и экспорт сторис.
            
            Как обновить:
            1. Скачай `app-debug.apk`.
            2. Если предыдущая версия была установлена ранее, удали её один раз, чтобы обновился ключ подписи. Все последующие обновления будут ставиться поверх автоматически в один клик.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
