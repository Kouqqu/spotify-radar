name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native APK in Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Inject Build Version
        run: |
          sed -i "s/CURRENT_RUN_NUMBER = .*/CURRENT_RUN_NUMBER = ${{ github.run_number }}/" android/app/src/main/java/com/spotifyradar/app/AppVersion.kt
          sed -i "s/CURRENT_TAG = .*/CURRENT_TAG = \"v1.2.0-${{ github.run_number }}\"/" android/app/src/main/java/com/spotifyradar/app/AppVersion.kt

      - name: Build Native APK with Gradle
        run: |
          cd android
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../SpotiRadar.apk

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle_build.log

      - name: Upload APK as Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SpotiRadar-APK
          path: SpotiRadar.apk
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          tag_name: v1.2.0-${{ github.run_number }}
          name: "SpotiRadar (v1.2.${{ github.run_number }})"
          body: |
            ### 🚀 SpotiRadar v1.2.${{ github.run_number }}
            
            - Официальный релиз SpotiRadar
            - Новый авторский логотип и фирменная иконка приложения
            - Улучшенная плавная работа и генерация карточек
          files: SpotiRadar.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
