name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native APK in Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Native APK with Gradle
        run: |
          cd android
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyRadar-Native-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-${{ github.run_number }}
          name: "Spotify Radar Native (v1.2.${{ github.run_number }})"
          body: |
            ### Настоящее нативное приложение Spotify Radar на Kotlin / Jetpack Compose!
            
            - **100% Native**: чистый Kotlin и Jetpack Compose, без браузерного движка и без WebView.
            - **120 FPS**: мгновенный отклик и плавный нативный скролл.
            - **Галерея**: прямое сохранение Stories-карточки 1080×1920 в память телефона через MediaStore.
            - **Шеринг**: системный Android Intent (Telegram, WhatsApp, VK, Stories).
            - **Импорт .csv**: системный проводник Android для выбора плейлиста.
            - **Постоянный ключ подписи**: обновления устанавливаются поверх без ошибок.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
